# Site settings
url    : "https://abinavrameshs.github.io"
baseurl: ""

title      : Abinav Ramesh
email      : abinavrameshs@gmail.com
description: "Abinav Ramesh — AI Engineer & Applied Machine Learning Scientist specializing in Gen AI, LLMs, RAG and agentic AI systems."
author     : Abinav Ramesh Sundararaman

analytics:
  google: # Google Analytics measurement ID, e.g. G-XXXXXXX

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

collections:
  projects:
    output: true
    permalink: /projects/:slug/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

exclude:
  - README.md
  - LICENSE.txt
  - Gemfile
  - Gemfile.lock
  - screenshot.PNG
  - .idea
  - vendor
