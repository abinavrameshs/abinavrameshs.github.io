<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="chat-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1e22"/>
      <stop offset="1" stop-color="#23282d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#chat-bg)"/>
  <rect x="60" y="60" width="680" height="380" rx="14" fill="#15181b" stroke="#33393f" stroke-width="1.5"/>
  <rect x="60" y="60" width="680" height="42" rx="14" fill="#20252a"/>
  <rect x="60" y="88" width="680" height="14" fill="#20252a"/>
  <circle cx="86" cy="81" r="6" fill="#fc6058"/>
  <circle cx="106" cy="81" r="6" fill="#fec02f"/>
  <circle cx="126" cy="81" r="6" fill="#28c840"/>
  <rect x="150" y="70" width="300" height="22" rx="11" fill="#2c3238"/>
  <text x="168" y="86" font-family="Menlo, Consolas, monospace" font-size="13" fill="#7d8791">app.local/llm-chatbot</text>

  <!-- user message -->
  <rect x="420" y="128" width="284" height="40" rx="12" fill="#f5b83d"/>
  <text x="438" y="153" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#15181b">What did I ask you earlier?</text>
  <!-- model reply -->
  <circle cx="110" cy="204" r="14" fill="#2c3238"/>
  <text x="110" y="209" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#f5b83d" text-anchor="middle">G</text>
  <rect x="136" y="186" width="400" height="64" rx="12" fill="#20252a"/>
  <text x="154" y="212" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#d7dbe0">You asked how to keep chat history</text>
  <text x="154" y="234" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#d7dbe0">across turns in Streamlit.</text>
  <!-- memory indicator -->
  <rect x="136" y="266" width="196" height="26" rx="13" fill="#2b2618" stroke="#f5b83d"/>
  <text x="234" y="283" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#f5b83d" text-anchor="middle">MEMORY · 6 TURNS</text>

  <!-- input -->
  <rect x="96" y="372" width="548" height="40" rx="8" fill="#20252a" stroke="#33393f" stroke-width="1.5"/>
  <text x="112" y="397" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#7d8791">Message gemini-2.0-flash…</text>
  <rect x="656" y="372" width="64" height="40" rx="8" fill="#f5b83d"/>
  <text x="688" y="397" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#15181b" text-anchor="middle">Send</text>
</svg>
