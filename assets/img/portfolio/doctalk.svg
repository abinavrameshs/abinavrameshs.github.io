<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1e22"/>
      <stop offset="1" stop-color="#23282d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>

  <rect x="60" y="60" width="680" height="380" rx="14" fill="#15181b" stroke="#33393f" stroke-width="1.5"/>
  <rect x="60" y="60" width="680" height="42" rx="14" fill="#20252a"/>
  <rect x="60" y="88" width="680" height="14" fill="#20252a"/>
  <circle cx="86" cy="81" r="6" fill="#fc6058"/>
  <circle cx="106" cy="81" r="6" fill="#fec02f"/>
  <circle cx="126" cy="81" r="6" fill="#28c840"/>
  <rect x="150" y="70" width="420" height="22" rx="11" fill="#2c3238"/>
  <text x="168" y="86" font-family="Menlo, Consolas, monospace" font-size="13" fill="#7d8791">app.local/doctalk</text>

  <text x="96" y="146" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">DocTalk</text>

  <!-- uploaded file chips -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700">
    <rect x="96" y="162" width="96" height="26" rx="13" fill="#2c3238"/>
    <text x="144" y="179" fill="#d7dbe0" text-anchor="middle">report.pdf</text>
    <rect x="200" y="162" width="88" height="26" rx="13" fill="#2c3238"/>
    <text x="244" y="179" fill="#d7dbe0" text-anchor="middle">photo.png</text>
    <rect x="296" y="162" width="90" height="26" rx="13" fill="#2c3238"/>
    <text x="341" y="179" fill="#d7dbe0" text-anchor="middle">memo.mp3</text>
  </g>

  <!-- chat bubbles -->
  <rect x="96" y="206" width="360" height="56" rx="14" fill="#2c3238"/>
  <text x="116" y="230" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#d7dbe0">What's the key risk called out on</text>
  <text x="116" y="248" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#d7dbe0">page 3, and what's in the photo?</text>

  <rect x="284" y="276" width="360" height="78" rx="14" fill="#fed136"/>
  <text x="304" y="300" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#212529">Page 3 flags supply-chain delays.</text>
  <text x="304" y="318" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#212529">The photo shows a warehouse floor</text>
  <text x="304" y="336" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#212529">plan with 3 marked bottlenecks.</text>

  <rect x="96" y="384" width="644" height="1" fill="#2c3238"/>
  <text x="96" y="406" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#7d8791">Text · Image · Audio · Document — one chat, one model</text>
</svg>
