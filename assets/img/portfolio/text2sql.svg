<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1e22"/>
      <stop offset="1" stop-color="#23282d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>

  <!-- browser window -->
  <rect x="60" y="60" width="680" height="380" rx="14" fill="#15181b" stroke="#33393f" stroke-width="1.5"/>
  <rect x="60" y="60" width="680" height="42" rx="14" fill="#20252a"/>
  <rect x="60" y="88" width="680" height="14" fill="#20252a"/>
  <circle cx="86" cy="81" r="6" fill="#fc6058"/>
  <circle cx="106" cy="81" r="6" fill="#fec02f"/>
  <circle cx="126" cy="81" r="6" fill="#28c840"/>
  <rect x="150" y="70" width="420" height="22" rx="11" fill="#2c3238"/>
  <text x="168" y="86" font-family="Menlo, Consolas, monospace" font-size="13" fill="#7d8791">app.local/conversational-txt2sql</text>

  <!-- app content -->
  <text x="96" y="146" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Talk with your tables</text>

  <rect x="96" y="164" width="540" height="40" rx="8" fill="#20252a" stroke="#f5b83d" stroke-width="1.5"/>
  <text x="112" y="189" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#d7dbe0">Show me last quarter's revenue by region</text>
  <rect x="648" y="164" width="72" height="40" rx="8" fill="#f5b83d"/>
  <text x="684" y="189" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#212529" text-anchor="middle">Ask</text>

  <rect x="96" y="224" width="608" height="130" rx="10" fill="#101315"/>
  <text x="116" y="252" font-family="Menlo, Consolas, monospace" font-size="13" fill="#f5b83d">SELECT</text>
  <text x="170" y="252" font-family="Menlo, Consolas, monospace" font-size="13" fill="#d7dbe0">region, SUM(revenue) AS total_revenue</text>
  <text x="116" y="274" font-family="Menlo, Consolas, monospace" font-size="13" fill="#f5b83d">FROM</text>
  <text x="155" y="274" font-family="Menlo, Consolas, monospace" font-size="13" fill="#d7dbe0">sales</text>
  <text x="116" y="296" font-family="Menlo, Consolas, monospace" font-size="13" fill="#f5b83d">WHERE</text>
  <text x="168" y="296" font-family="Menlo, Consolas, monospace" font-size="13" fill="#d7dbe0">quarter = 'Q4-2025'</text>
  <text x="116" y="318" font-family="Menlo, Consolas, monospace" font-size="13" fill="#f5b83d">GROUP BY</text>
  <text x="196" y="318" font-family="Menlo, Consolas, monospace" font-size="13" fill="#d7dbe0">region;</text>
  <rect x="116" y="332" width="596" height="1" fill="#2c3238"/>
  <circle cx="120" cy="342" r="3" fill="#28c840"/>
  <text x="130" y="346" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#7d8791">Validated against schema · 0.8s</text>

  <text x="96" y="384" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7d8791">West   $482,100</text>
  <text x="240" y="384" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7d8791">East   $391,760</text>
  <text x="384" y="384" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7d8791">North  $275,430</text>
</svg>
