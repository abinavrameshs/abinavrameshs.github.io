{%- assign p = include.project -%}
<article class="mini-card">
  <p class="eyebrow">{{ p.category }}</p>
  <h3 class="mini-card__title"><a class="card__link" href="{{ p.url | relative_url }}">{{ p.title }}</a></h3>
  <p class="mini-card__summary">{{ p.summary }}</p>
  <ul class="tags tags--quiet" aria-label="Tech stack">
    {%- for t in p.tags limit: 3 %}<li>{{ t }}</li>{% endfor -%}
  </ul>
</article>
