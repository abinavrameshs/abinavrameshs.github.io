<footer class="site-footer">
  <div class="container site-footer__inner">
    <p class="site-footer__copy">&copy; {{ site.time | date: "%Y" }} {{ site.author }}</p>
    <ul class="social">
      {%- for link in site.data.sitetext.footer.social %}
      <li><a href="{{ link.url }}" aria-label="{{ link.label }}" rel="noopener"><i class="{{ link.icon }}" aria-hidden="true"></i></a></li>
      {%- endfor %}
      <li><a href="mailto:{{ site.email }}" aria-label="Email"><i class="fas fa-envelope" aria-hidden="true"></i></a></li>
    </ul>
    <a class="site-footer__legal" href="{{ '/legal/' | relative_url }}">{{ site.data.sitetext.footer.legal }}</a>
  </div>
</footer>
