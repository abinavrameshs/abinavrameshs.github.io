timeline:
    title: "About"
    image: assets/img/timeline/chubb_200_200.png
    text: "Hi, I am an AI Engineer and Applied Machine Learning Scientist with 7+ years of experience designing and shipping production Gen AI systems - RAG pipelines, enterprise LLM assistants, agentic workflows and AI governance platforms - built on a solid foundation of traditional Machine Learning and Analytics. I consider myself a problem solver, passionate about turning cutting-edge AI into measurable business impact. I am also a fun and enthusiastic person who is willing to explore and constantly learn. I am open to any kind of Gen AI, Machine Learning or Data-related opportunity, where I can utilize my expertise to help the world become a better place. Please feel free to keep in touch with me at <a href=\"mailto:abinavrameshs@gmail.com?subject=Connection request&body=Hello Abinav,%0DI hope you are doing good. Nice to e-meet you. Glad we can make a connection! %0DRegards\">abinavrameshs@gmail.com</a>"
    section: timeline
    # left is the default
    #start_align: "left"
    events:
      - title: "Chubb"
        year: "NOV 2025 - PRESENT"
        desc: "Senior AI Engineer building *AI Studio*, an enterprise platform for AI governance of MCP tools, agents and models - designing APIs and microservices, integrating Dify and Azure services for secure, governable GenAI use, and embedding governance guardrails (access, lineage, monitoring) into the agent/model lifecycle."
        image: assets/img/timeline/chubb_200_200.png
        alt: Chubb
      - title: "TD Bank Group"
        year: "AUG 2021 - DEC 2025"
        desc: "4.5 years in Personal Banking Data & Analytics, progressing from Data Scientist to Machine Learning Engineer (Layer 6 AI) to Senior Applied Machine Learning Scientist. Delivered $5MM in value building a ChatGPT-like enterprise assistant on Azure OpenAI and Azure AI Search with a RAG pipeline (query rewriting, ranking, insufficiency detection). Built a standardized RAG framework that cut application build time from 12 to 7 weeks, and time-series liquidity forecasting models saving $10M CAD annually."
        image: assets/img/timeline/TD_200_200.png
        alt: TD Bank Group
      - title: "The Bigger Data"
        year: "OCT 2020 - SEP 2022"
        desc: "Data Science Project Manager at [The Bigger Data](https://www.linkedin.com/company/thebiggerdata/), leading a team of 5 to deliver analytics solutions for non-profits - improving operational efficiency by 30%, data accuracy by 90%, and building governance frameworks that avoided $200K in potential regulatory fines. Worked with AIESEC to improve their business model through analytics."
        image: assets/img/timeline/TBD_200_200.jpg
        alt: The Bigger Data
      - title: "Bell Mobility"
        year: "JUL 2019 - AUG 2021"
        desc: "Data Science Developer building critical AI/ML products: a modem self-healing system that saved $1.1M CAD by proactively detecting and fixing degraded customer experience, proactive network outage prediction, automated reboot workflows resolving 40% of modem issues, and MicroStrategy dashboards driving $500K in annual savings."
        image: assets/img/timeline/bell_200_200.jpg
        alt: Bell Mobility
      - title: "McGill University"
        year: "AUG 2018 - JUL 2019"
        desc: "Masters of Management in Analytics (MMA) from McGill University (GPA 3.92, Dean's Honour List, Best Capstone Project, Best Outgoing Student Award). Capstone: Data Engineer/Modeller intern at McKesson Canada, building a Supplier Performance Management Program that saved up to $600K."
        image: assets/img/timeline/mcgill_200_200.jpg
        alt: Master's degree
      - title: "Deloitte Consulting"
        year: "AUG 2016 - JUL 2018"
        desc: "Business Technology Analyst working across the full application lifecycle for US clients: converted 50+ OBIEE reports to SAP Business Objects on a SAP HANA backend, resolved 500+ production tickets as a Production Support Engineer with 100% SLA compliance, and served as a System Integration Tester for a major healthcare insurance provider. Received the Applause Award for outstanding performance."
        image: assets/img/timeline/deloitte_200_200.jpg
        alt: First place of work
      - title: "National Institute of Technology Karnataka"
        year: "JUL 2012 - JUL 2016"
        desc: "Bachelors of Technology in Electronics and Communication Engineering"
        image: assets/img/timeline/nitk_200_200.jpg
        alt: Bachelors Degree
    end: "Where it all began"

