experience:
  section: experience
  title: "Experience"
  text: "I build Gen AI systems that hold up in production: agents, agentic workflows and the RAG pipelines underneath them. Seven years of machine learning and analytics taught me to judge every system by the business impact it delivers."
  events:
    - title: "Chubb"
      role: "Senior AI Engineer"
      year: "Nov 2025 – Present"
      desc: "Building *AI Studio*, an enterprise platform for AI governance of MCP tools, agents and models - designing APIs and microservices, integrating Dify and Azure services for secure, governable GenAI use, and embedding governance guardrails (access, lineage, monitoring) into the agent/model lifecycle."
      image: assets/img/timeline/chubb_200_200.png
      alt: Chubb
    - title: "TD Bank Group"
      role: "Data Scientist → ML Engineer (Layer 6 AI) → Senior Applied ML Scientist"
      year: "Aug 2021 – Dec 2025"
      desc: "4.5 years in Personal Banking Data & Analytics. Delivered $5MM in value building an Agentic Enterprise Assistant on Azure OpenAI and Azure AI Search, grounded by a RAG pipeline (query rewriting, ranking, insufficiency detection). Built a standardized RAG framework that cut application build time from 12 to 7 weeks, and time-series liquidity forecasting models saving $10M CAD annually."
      image: assets/img/timeline/TD_200_200.png
      alt: TD Bank Group
    - title: "The Bigger Data"
      role: "Data Science Project Manager"
      year: "Oct 2020 – Sep 2022"
      desc: "Led a team of 5 at [The Bigger Data](https://www.linkedin.com/company/thebiggerdata/) to deliver analytics solutions for non-profits - improving operational efficiency by 30%, data accuracy by 90%, and building governance frameworks that avoided $200K in potential regulatory fines. Worked with AIESEC to improve their business model through analytics."
      image: assets/img/timeline/TBD_200_200.jpg
      alt: The Bigger Data
    - title: "Bell Mobility"
      role: "Data Science Developer"
      year: "Jul 2019 – Aug 2021"
      desc: "Built critical AI/ML products: a modem self-healing system that saved $1.1M CAD by proactively detecting and fixing degraded customer experience, proactive network outage prediction, automated reboot workflows resolving 40% of modem issues, and MicroStrategy dashboards driving $500K in annual savings."
      image: assets/img/timeline/bell_200_200.jpg
      alt: Bell Mobility
    - title: "McGill University"
      role: "Master of Management in Analytics (MMA)"
      year: "Aug 2018 – Jul 2019"
      desc: "GPA 3.92, Dean's Honour List, Best Capstone Project and Best Outgoing Student Award. Capstone: Data Engineer/Modeller intern at McKesson Canada, building a Supplier Performance Management Program that saved up to $600K."
      image: assets/img/timeline/mcgill_200_200.jpg
      alt: McGill University
    - title: "Deloitte Consulting"
      role: "Business Technology Analyst"
      year: "Aug 2016 – Jul 2018"
      desc: "Worked across the full application lifecycle for US clients: converted 50+ OBIEE reports to SAP Business Objects on a SAP HANA backend, resolved 500+ production tickets as a Production Support Engineer with 100% SLA compliance, and served as a System Integration Tester for a major healthcare insurance provider. Received the Applause Award for outstanding performance."
      image: assets/img/timeline/deloitte_200_200.jpg
      alt: Deloitte
    - title: "National Institute of Technology Karnataka"
      role: "B.Tech, Electronics and Communication Engineering"
      year: "Jul 2012 – Jul 2016"
      desc: ""
      image: assets/img/timeline/nitk_200_200.jpg
      alt: NITK

